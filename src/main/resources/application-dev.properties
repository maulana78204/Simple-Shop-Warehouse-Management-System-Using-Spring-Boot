# Development Environment Configuration

# Server
server.port=8080
server.servlet.context-path=/api

# Database - H2 In-Memory
spring.datasource.url=jdbc:h2:mem:warehousedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS WAREHOUSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate - VALIDATE ONLY (V001 schema handles all)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.default_schema=warehouse

# Flyway - ENABLED (Use V001 schema file)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging - Verbose for Development
logging.level.root=INFO
logging.level.com.warehouse=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# H2 Console - Enabled for Development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Security - Less Strict for Development
security.cors.allowed-origins=*
security.cors.allow-credentials=false

# JWT - Long expiration for development
jwt.secret=dev-secret-key-minimum-256-bits-long-for-hs256-algorithm-in-development
jwt.expiration=604800000

# Actuator - All endpoints exposed
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Application
app.environment=development
app.data-loader.enabled=true
app.data-loader.sample-size=5

# Devtools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Error Handling
server.error.include-stacktrace=always
server.error.include-binding-errors=always

# Performance Monitoring
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.logback=true

# Production Environment Configuration

# Server
server.port=8080
server.servlet.context-path=/api
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Database - PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.use_scrollable_resultset=false

# Flyway - ENABLED (Use V001 schema file)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging - Production (File Only)
logging.level.root=WARN
logging.level.com.warehouse=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/var/log/warehouse/application.log
logging.file.max-size=100MB
logging.file.max-history=30

# H2 Console - Disabled
spring.h2.console.enabled=false

# Security - Strict for Production
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
security.cors.allow-credentials=true
security.cors.max-age=3600

# JWT - Secure Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Actuator - Limited Endpoints
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=health-check

# OpenAPI/Swagger - Disabled
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

# Application
app.environment=production
app.data-loader.enabled=false

# Performance & Caching
spring.cache.type=redis
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.password=${REDIS_PASSWORD}

# Error Handling
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Session Configuration
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Compression
server.compression.enabled=true
server.compression.min-response-size=1024

# Security Headers
server.servlet.session.cookie.domain=${DOMAIN}
server.servlet.session.cookie.path=/

# Monitoring
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.exposure.include=health,metrics,prometheus

# Rate Limiting
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=1000

# Timeout Configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Warehouse Management System - Default Application Properties

# Application Info
spring.application.name=warehouse-management
spring.application.version=1.0.0

# Server Configuration - SIMPLE: No context path
server.port=8080
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.min-response-size=1024

# Database - Default (H2 for development)
spring.datasource.url=jdbc:h2:mem:warehousedb;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS WAREHOUSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway Configuration - DISABLED
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.warehouse=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# JWT Configuration
jwt.secret=your-256-bit-secret-key-must-be-at-least-256-bits-for-hs256-algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Spring Security - Default user
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# H2 Console (Development Only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Application Custom Properties
app.name=Warehouse Management System
app.description=RESTful API for shop warehouse inventory management
app.version=1.0.0
app.environment=development

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Hikari Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=on-param
server.error.include-exception=false
server.error.include-binding-errors=always
